version: "3.8"
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server  # crea uno si no existe
    container_name: react-chat-server
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    depends_on:
      - server

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    # opcional: montar /proc, /sys si quieres host metrics (ver doc)
