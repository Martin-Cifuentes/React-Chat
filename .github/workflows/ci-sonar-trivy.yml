name: CI - SonarQube & Trivy Security Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '18.x'
  DOCKER_IMAGE: react-chat
  SONAR_SCANNER_VERSION: '6.2.1.4610'

jobs:
  security-analysis:
    name: Code Quality & Security Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug project structure
        run: |
          echo "=== root files ==="
          ls -la
          echo "=== find package.json files ==="
          find . -type f -name "package.json" -print || true
          echo "=== front dir listing ==="
          ls -la front-SecureChat || echo "front-SecureChat not found"
          echo "=== server dir listing ==="
          ls -la server || echo "server not found"
          echo "=== show root package.json scripts (if exists) ==="
          if [ -f package.json ]; then cat package.json | sed -n '1,200p'; fi

      # Node setup (cache npm)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            front-SecureChat/package-lock.json
            package-lock.json

      # Install dependencies (frontend + server)
      - name: Install client dependencies
        working-directory: ./front-SecureChat
        run: |
          if [ -f package-lock.json ] || [ -f package.json ]; then
            npm ci
          else
            echo "No package.json in front-SecureChat, skipping"
          fi

      - name: Install server dependencies
        working-directory: ./server
        run: |
          if [ -f package-lock.json ] || [ -f package.json ]; then
            npm ci
          else
            echo "No package.json in server/, skipping"
          fi

      # Tests & coverage (continue-on-error para no bloquear CI si no hay tests)
      - name: Run client tests with coverage
        working-directory: ./front-SecureChat
        run: |
          if npm run | grep -q "test"; then
            npm test -- --coverage --watchAll=false --passWithNoTests
          else
            echo "No test script in front-SecureChat/package.json, skipping"
          fi
        continue-on-error: true
        env:
          CI: true

      - name: Run server tests with coverage
        working-directory: ./server
        run: |
          if npm run | grep -q "test"; then
            npm test -- --coverage --watchAll=false --passWithNoTests
          else
            echo "No test script in server/package.json, skipping"
          fi
        continue-on-error: true
        env:
          CI: true

      # Build frontend & server (if scripts exist)
      - name: Build client
        working-directory: ./front-SecureChat
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script in front-SecureChat/package.json, skipping"
          fi
        continue-on-error: true

      - name: Verify client build folder
        working-directory: ./front-SecureChat
        run: |
          echo "=== front-SecureChat content ==="
          ls -la
          if [ -d build ] || [ -d dist ]; then
            echo "Build output exists"
            ls -la build || ls -la dist || true
          else
            echo "No build output (build/ or dist/), ensure project builds for production"
          fi

      - name: Build server (if build script)
        working-directory: ./server
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script in server/package.json, skipping build"
          fi
        continue-on-error: true

      # Docker image (create Dockerfile only if missing)
      - name: Create Dockerfile if not exists
        run: |
          if [ ! -f Dockerfile ]; then
            cat > Dockerfile <<'EOF'
# Multi-stage build para React-Chat
FROM node:18-alpine AS client-build
WORKDIR /app
COPY front-SecureChat/package*.json ./front-SecureChat/
RUN cd front-SecureChat && npm ci
COPY front-SecureChat/ ./front-SecureChat/
RUN cd front-SecureChat && npm run build

FROM node:18-alpine AS server-build
WORKDIR /app
COPY server/package*.json ./server/
RUN cd server && npm ci --only=production
COPY server/ ./server/

FROM node:18-alpine
WORKDIR /app
# copy built frontend (assuming output in front-SecureChat/build or front-SecureChat/dist)
COPY --from=client-build /app/front-SecureChat/build ./front-SecureChat/build
COPY --from=server-build /app/server ./server
EXPOSE 3001
CMD ["node", "server/src/index.js"]
EOF
          else
            echo "Dockerfile already exists"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }},${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Install Trivy (apt) and scan
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan Docker image with Trivy
        run: |
          trivy image \
            --format json \
            --output trivy-image-report.json \
            --severity HIGH,CRITICAL \
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
        continue-on-error: true

      - name: Scan filesystem with Trivy
        run: |
          trivy fs \
            --format json \
            --output trivy-fs-report.json \
            --severity HIGH,CRITICAL \
            --scanners vuln,secret,misconfig \
            .
        continue-on-error: true

      # Python for conversion
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Convert Trivy reports to SonarQube format
        run: |
          if [ -f scripts/trivy-to-sonar.py ]; then
            python3 scripts/trivy-to-sonar.py \
              --image-report trivy-image-report.json \
              --fs-report trivy-fs-report.json \
              --output sonar-trivy.json
          else
            echo "scripts/trivy-to-sonar.py not found - skipping conversion step"
            # create minimal sonar-trivy.json to avoid sonar failure (empty array)
            echo "[]" > sonar-trivy.json
          fi

      # Sonar scan
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          npm install -g @sonar/scanner@${{ env.SONAR_SCANNER_VERSION }}
          sonar-scanner \
            -Dsonar.projectKey=react-chat \
            -Dsonar.sources=front-SecureChat/src,server/src,server,front-SecureChat \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.externalIssuesReportPaths=sonar-trivy.json \
            -Dsonar.javascript.lcov.reportPaths=front-SecureChat/coverage/lcov.info,server/coverage/lcov.info \
            -Dsonar.scm.provider=git

      # Upload artifacts for debugging
      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: |
            trivy-image-report.json
            trivy-fs-report.json
            sonar-trivy.json
          retention-days: 30

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            front-SecureChat/coverage/
            server/coverage/
          retention-days: 30

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

      - name: Generate summary
        if: always()
        run: |
          echo "## 🔍 Security Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SonarQube Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- **Project:** react-chat" >> $GITHUB_STEP_SUMMARY
          echo "- **Dashboard:** ${{ secrets.SONAR_HOST_URL }}/dashboard?id=react-chat" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Trivy Scans" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Image Scan: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Filesystem Scan: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reports available in artifacts**" >> $GITHUB_STEP_SUMMARY
