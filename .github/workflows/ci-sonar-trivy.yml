name: CI - SonarQube & Trivy Security Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '18.x'
  DOCKER_IMAGE: react-chat
  SONAR_SCANNER_VERSION: '6.2.1.4610'

jobs:
  security-analysis:
    name: Code Quality & Security Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug project structure
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== Find package.json files ==="
          find . -type f -name "package.json" -print || true
          echo "=== Front dir listing ==="
          ls -la front-SecureChat || echo "front-SecureChat not found"
          echo "=== Server dir listing ==="
          ls -la server || echo "server not found"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install client dependencies
        working-directory: ./front-SecureChat
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json in front-SecureChat, skipping"
          fi

      - name: Install server dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json in root, skipping"
          fi

      - name: Run client tests with coverage
        working-directory: ./front-SecureChat
        continue-on-error: true
        env:
          CI: true
        run: |
          if npm run 2>/dev/null | grep -q "test"; then
            npm test -- --coverage --watchAll=false --passWithNoTests
          else
            echo "No test script in front-SecureChat/package.json"
            mkdir -p coverage
          fi

      - name: Run server tests with coverage
        continue-on-error: true
        env:
          CI: true
        run: |
          if npm run 2>/dev/null | grep -q "test"; then
            npm test -- --coverage --watchAll=false --passWithNoTests
          else
            echo "No test script in root package.json"
            mkdir -p coverage
          fi

      - name: Build client
        working-directory: ./front-SecureChat
        continue-on-error: true
        run: |
          if npm run 2>/dev/null | grep -q "build"; then
            npm run build
          else
            echo "No build script found, skipping"
          fi

      - name: Verify client build folder
        working-directory: ./front-SecureChat
        run: |
          echo "=== Front-SecureChat content ==="
          ls -la
          if [ -d dist ]; then
            echo "✓ Build output exists in dist/"
            ls -la dist
          elif [ -d build ]; then
            echo "✓ Build output exists in build/"
            ls -la build
          else
            echo "⚠ No build output found"
          fi

      - name: Create Dockerfile
        run: |
          cat > Dockerfile <<'EOF'
          # Multi-stage build para SecureChat
          FROM node:18-alpine AS client-build
          WORKDIR /app
          COPY front-SecureChat/package*.json ./front-SecureChat/
          RUN cd front-SecureChat && npm ci
          COPY front-SecureChat/ ./front-SecureChat/
          RUN cd front-SecureChat && npm run build

          FROM node:18-alpine AS server-deps
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci --only=production

          FROM node:18-alpine
          WORKDIR /app
          
          # Copiar build del cliente
          COPY --from=client-build /app/front-SecureChat/dist ./front-SecureChat/dist
          
          # Copiar dependencias y código del servidor
          COPY --from=server-deps /app/node_modules ./node_modules
          COPY server ./server
          COPY package*.json ./
          
          EXPOSE 4000
          
          CMD ["node", "server/index.js"]
          EOF
          echo "✓ Dockerfile created successfully"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }},${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan Docker image with Trivy
        continue-on-error: true
        run: |
          trivy image \
            --format json \
            --output trivy-image-report.json \
            --severity HIGH,CRITICAL \
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Scan filesystem with Trivy
        continue-on-error: true
        run: |
          trivy fs \
            --format json \
            --output trivy-fs-report.json \
            --severity HIGH,CRITICAL \
            --scanners vuln,secret,misconfig \
            .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create Trivy to SonarQube converter
        run: |
          mkdir -p scripts
          cat > scripts/trivy-to-sonar.py <<'PYTHON'
          #!/usr/bin/env python3
          import json
          import sys
          import argparse

          def convert_trivy_to_sonar(image_report, fs_report, output_file):
              issues = []
              
              def process_report(report_path, source_prefix):
                  try:
                      with open(report_path, 'r') as f:
                          data = json.load(f)
                      
                      if 'Results' in data:
                          for result in data['Results']:
                              target = result.get('Target', 'unknown')
                              vulnerabilities = result.get('Vulnerabilities', [])
                              
                              for vuln in vulnerabilities:
                                  issue = {
                                      "engineId": "trivy",
                                      "ruleId": vuln.get('VulnerabilityID', 'UNKNOWN'),
                                      "severity": map_severity(vuln.get('Severity', 'UNKNOWN')),
                                      "type": "VULNERABILITY",
                                      "primaryLocation": {
                                          "message": f"{vuln.get('Title', 'No title')} - {vuln.get('Description', 'No description')}",
                                          "filePath": f"{source_prefix}/{target}"
                                      }
                                  }
                                  issues.append(issue)
                  except FileNotFoundError:
                      print(f"Warning: {report_path} not found", file=sys.stderr)
                  except json.JSONDecodeError:
                      print(f"Warning: {report_path} is not valid JSON", file=sys.stderr)
              
              def map_severity(trivy_severity):
                  mapping = {
                      'CRITICAL': 'CRITICAL',
                      'HIGH': 'MAJOR',
                      'MEDIUM': 'MINOR',
                      'LOW': 'INFO',
                      'UNKNOWN': 'INFO'
                  }
                  return mapping.get(trivy_severity.upper(), 'INFO')
              
              if image_report:
                  process_report(image_report, 'docker')
              
              if fs_report:
                  process_report(fs_report, 'filesystem')
              
              with open(output_file, 'w') as f:
                  json.dump({"issues": issues}, f, indent=2)
              
              print(f"Converted {len(issues)} issues to SonarQube format")

          if __name__ == '__main__':
              parser = argparse.ArgumentParser()
              parser.add_argument('--image-report', help='Path to Trivy image report')
              parser.add_argument('--fs-report', help='Path to Trivy filesystem report')
              parser.add_argument('--output', required=True, help='Output file path')
              
              args = parser.parse_args()
              convert_trivy_to_sonar(args.image_report, args.fs_report, args.output)
          PYTHON
          
          chmod +x scripts/trivy-to-sonar.py
          echo "✓ Converter script created"

      - name: Convert Trivy reports to SonarQube format
        run: |
          python3 scripts/trivy-to-sonar.py \
            --image-report trivy-image-report.json \
            --fs-report trivy-fs-report.json \
            --output sonar-trivy.json

      - name: Create SonarQube properties
        run: |
          cat > sonar-project.properties <<'EOF'
          sonar.projectKey=react-chat
          sonar.projectName=SecureChat
          sonar.projectVersion=1.0
          
          sonar.sources=front-SecureChat/src,server
          sonar.tests=front-SecureChat/src,server
          sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx
          
          sonar.javascript.lcov.reportPaths=front-SecureChat/coverage/lcov.info,coverage/lcov.info
          sonar.externalIssuesReportPaths=sonar-trivy.json
          
          sonar.sourceEncoding=UTF-8
          sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.js,**/*.spec.js
          EOF
          echo "✓ SonarQube properties created"

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true
        run: |
          npm install -g sonarqube-scanner@${{ env.SONAR_SCANNER_VERSION }}
          sonar-scanner \
            -Dsonar.projectKey=react-chat \
            -Dsonar.sources=front-SecureChat/src,server \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.javascript.lcov.reportPaths=front-SecureChat/coverage/lcov.info,coverage/lcov.info \
            -Dsonar.externalIssuesReportPaths=sonar-trivy.json

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: |
            trivy-image-report.json
            trivy-fs-report.json
            sonar-trivy.json
          retention-days: 30

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            front-SecureChat/coverage/
            coverage/
          retention-days: 30

      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

      - name: Generate summary
        if: always()
        run: |
          echo "## 🔍 Security Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 SonarQube Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- **Project:** react-chat" >> $GITHUB_STEP_SUMMARY
          echo "- **Dashboard:** ${{ secrets.SONAR_HOST_URL }}/dashboard?id=react-chat" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔒 Trivy Security Scans" >> $GITHUB_
