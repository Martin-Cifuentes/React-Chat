---
# Ansible Playbook para configurar SonarQube en VM existente
# Requisitos: VM Ubuntu 22.04 LTS, acceso SSH con usuario sudo
# Uso: ansible-playbook -i inventory.ini configure-sonarqube.yml --ask-vault-pass

- name: Configurar SonarQube en VM Azure
  hosts: sonarqube_server
  become: yes
  vars:
    # Versión SonarQube - usando 10.7 LTS por estabilidad y soporte extendido
    sonarqube_version: "10.7.0.96327"
    sonarqube_download_url: "https://binaries.sonarsource.com/Distribution/sonarqube/sonarqube-{{ sonarqube_version }}.zip"
    
    # PostgreSQL configuración
    postgres_version: "15"
    sonar_db_name: "sonar"
    sonar_db_user: "sonar"
    # IMPORTANTE: Cambiar en producción y guardar en ansible-vault
    sonar_db_password: "{{ vault_sonar_db_password | default('S0n4rP@ssw0rd!2025') }}"
    
    # Directorios
    sonar_install_dir: "/opt/sonarqube"
    sonar_data_dir: "/var/sonarqube"
    
    # Sistema
    sonar_user: "sonarqube"
    sonar_group: "sonarqube"
    
    # Java
    java_version: "17"
    
  tasks:
    # ============================================
    # 1. PREPARACIÓN DEL SISTEMA
    # ============================================
    - name: Actualizar cache de paquetes
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Instalar dependencias del sistema
      apt:
        name:
          - openjdk-{{ java_version }}-jdk
          - unzip
          - wget
          - curl
          - gnupg2
          - software-properties-common
          - ufw
        state: present

    - name: Verificar versión de Java instalada
      command: java -version
      register: java_version_output
      changed_when: false

    - name: Mostrar versión de Java
      debug:
        msg: "{{ java_version_output.stderr_lines }}"

    # ============================================
    # 2. CONFIGURACIÓN POSTGRESQL
    # ============================================
    - name: Agregar repositorio PostgreSQL
      shell: |
        echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list
        wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | apt-key add -
      args:
        creates: /etc/apt/sources.list.d/pgdg.list

    - name: Instalar PostgreSQL
      apt:
        name:
          - postgresql-{{ postgres_version }}
          - postgresql-contrib-{{ postgres_version }}
          - python3-psycopg2
        state: present
        update_cache: yes

    - name: Asegurar que PostgreSQL está iniciado
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: Crear usuario de base de datos para SonarQube
      become_user: postgres
      postgresql_user:
        name: "{{ sonar_db_user }}"
        password: "{{ sonar_db_password }}"
        role_attr_flags: CREATEDB,NOSUPERUSER
        state: present

    - name: Crear base de datos SonarQube
      become_user: postgres
      postgresql_db:
        name: "{{ sonar_db_name }}"
        owner: "{{ sonar_db_user }}"
        encoding: UTF8
        template: template0
        state: present

    # ============================================
    # 3. AJUSTES DEL SISTEMA PARA SONARQUBE
    # ============================================
    - name: Configurar límites del sistema (vm.max_map_count)
      sysctl:
        name: vm.max_map_count
        value: "262144"
        state: present
        reload: yes
      # Elasticsearch (usado por SonarQube) requiere este ajuste

    - name: Configurar límites del sistema (fs.file-max)
      sysctl:
        name: fs.file-max
        value: "65536"
        state: present
        reload: yes

    - name: Configurar límites de usuario para SonarQube
      pam_limits:
        domain: "{{ sonar_user }}"
        limit_type: "{{ item.type }}"
        limit_item: "{{ item.item }}"
        value: "{{ item.value }}"
      loop:
        - { type: 'soft', item: 'nofile', value: '65536' }
        - { type: 'hard', item: 'nofile', value: '65536' }
        - { type: 'soft', item: 'nproc', value: '4096' }
        - { type: 'hard', item: 'nproc', value: '4096' }

    # ============================================
    # 4. INSTALACIÓN SONARQUBE
    # ============================================
    - name: Crear usuario y grupo para SonarQube
      user:
        name: "{{ sonar_user }}"
        group: "{{ sonar_group }}"
        system: yes
        create_home: no
        shell: /bin/bash

    - name: Crear directorios para SonarQube
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ sonar_user }}"
        group: "{{ sonar_group }}"
        mode: '0755'
      loop:
        - "{{ sonar_install_dir }}"
        - "{{ sonar_data_dir }}/data"
        - "{{ sonar_data_dir }}/temp"
        - "{{ sonar_data_dir }}/logs"

    - name: Verificar si SonarQube ya está instalado
      stat:
        path: "{{ sonar_install_dir }}/bin"
      register: sonar_installed

    - name: Descargar SonarQube
      get_url:
        url: "{{ sonarqube_download_url }}"
        dest: "/tmp/sonarqube-{{ sonarqube_version }}.zip"
        mode: '0644'
      when: not sonar_installed.stat.exists

    - name: Extraer SonarQube
      unarchive:
        src: "/tmp/sonarqube-{{ sonarqube_version }}.zip"
        dest: "/tmp"
        remote_src: yes
      when: not sonar_installed.stat.exists

    - name: Mover archivos de SonarQube al directorio de instalación
      shell: |
        cp -r /tmp/sonarqube-{{ sonarqube_version }}/* {{ sonar_install_dir }}/
        chown -R {{ sonar_user }}:{{ sonar_group }} {{ sonar_install_dir }}
      when: not sonar_installed.stat.exists

    - name: Limpiar archivos temporales
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/sonarqube-{{ sonarqube_version }}.zip"
        - "/tmp/sonarqube-{{ sonarqube_version }}"
      when: not sonar_installed.stat.exists

    # ============================================
    # 5. CONFIGURACIÓN SONARQUBE
    # ============================================
    - name: Configurar sonar.properties
      template:
        src: templates/sonar.properties.j2
        dest: "{{ sonar_install_dir }}/conf/sonar.properties"
        owner: "{{ sonar_user }}"
        group: "{{ sonar_group }}"
        mode: '0644'
      notify: restart sonarqube

    - name: Configurar wrapper.conf (memoria Java)
      lineinfile:
        path: "{{ sonar_install_dir }}/conf/wrapper.conf"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^wrapper.java.additional.5=', line: 'wrapper.java.additional.5=-Xmx2048m' }
        - { regexp: '^wrapper.java.additional.6=', line: 'wrapper.java.additional.6=-Xms512m' }
      notify: restart sonarqube

    # ============================================
    # 6. CONFIGURACIÓN SYSTEMD
    # ============================================
    - name: Crear servicio systemd para SonarQube
      template:
        src: templates/sonarqube.service.j2
        dest: /etc/systemd/system/sonarqube.service
        mode: '0644'
      notify: restart sonarqube

    - name: Recargar configuración systemd
      systemd:
        daemon_reload: yes

    - name: Habilitar e iniciar servicio SonarQube
      systemd:
        name: sonarqube
        enabled: yes
        state: started

    # ============================================
    # 7. CONFIGURACIÓN FIREWALL
    # ============================================
    - name: Habilitar UFW
      ufw:
        state: enabled
        policy: deny

    - name: Permitir SSH
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Permitir puerto SonarQube (9000)
      ufw:
        rule: allow
        port: '9000'
        proto: tcp
        comment: 'SonarQube web interface'
      # NOTA: En producción, restringir a IPs específicas o VNet

    - name: Recargar UFW
      ufw:
        state: reloaded

    # ============================================
    # 8. ESPERAR A QUE SONARQUBE ESTÉ LISTO
    # ============================================
    - name: Esperar a que SonarQube esté disponible (puede tardar 2-3 minutos)
      uri:
        url: "http://localhost:9000/api/system/status"
        method: GET
        status_code: 200
      register: result
      until: result.status == 200 and result.json.status == "UP"
      retries: 30
      delay: 10

    - name: Mostrar estado de SonarQube
      debug:
        msg: "SonarQube está disponible en http://{{ ansible_default_ipv4.address }}:9000"

  # ============================================
  # HANDLERS
  # ============================================
  handlers:
    - name: restart sonarqube
      systemd:
        name: sonarqube
        state: restarted

# ============================================
# TEMPLATES NECESARIOS
# ============================================
# Crear archivo: ansible/templates/sonar.properties.j2
# Crear archivo: ansible/templates/sonarqube.service.j2

---
# Ansible Playbook para instalar y configurar Prometheus y Grafana
# Requisitos: VM Ubuntu 22.04 LTS, acceso SSH con usuario sudo
# Uso: ansible-playbook -i inventory.ini configure-monitoring.yml --ask-vault-pass

- name: Configurar Prometheus y Grafana en VM Azure
  hosts: monitoring_server
  become: yes
  tasks:
    # ============================================
    # 1. INSTALACIÓN Y CONFIGURACIÓN DE PROMETHEUS
    # ============================================
    - name: Crear directorio para configuración de Prometheus
      file:
        path: /etc/prometheus
        state: directory
        mode: '0755'

    - name: Descargar archivo de configuración de Prometheus
      get_url:
        url: https://raw.githubusercontent.com/prometheus/prometheus/main/documentation/examples/prometheus.yml
        dest: /etc/prometheus/prometheus.yml
        mode: '0644'
        force: no

    - name: Crear grupo de sistema para Prometheus
      group:
        name: prometheus
        system: yes
        state: present

    - name: Crear usuario de sistema para Prometheus
      user:
        name: prometheus
        system: yes
        group: prometheus
        create_home: no
        shell: /bin/false

    - name: Descargar y extraer Prometheus
      unarchive:
        src: https://github.com/prometheus/prometheus/releases/download/v2.47.1/prometheus-2.47.1.linux-amd64.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Copiar binario de Prometheus
      copy:
        src: /tmp/prometheus-2.47.1.linux-amd64/prometheus
        dest: /usr/local/bin/
        mode: '0755'
        remote_src: yes

    - name: Configurar servicio de Prometheus
      copy:
        dest: /etc/systemd/system/prometheus.service
        content: |
          [Unit]
          Description=Prometheus
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/prometheus \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/var/lib/prometheus \
            --web.console.templates=/etc/prometheus/consoles \
            --web.console.libraries=/etc/prometheus/console_libraries

          [Install]
          WantedBy=multi-user.target

    - name: Iniciar y habilitar servicio de Prometheus
      systemd:
        name: prometheus
        state: started
        enabled: yes
        daemon_reload: yes

    # ============================================
    # 2. INSTALACIÓN Y CONFIGURACIÓN DE GRAFANA
    # ============================================
    - name: Agregar clave GPG de Grafana
      apt_key:
        url: https://packages.grafana.com/gpg.key
        state: present

    - name: Agregar repositorio de Grafana
      apt_repository:
        repo: deb https://packages.grafana.com/oss/deb stable main
        state: present
        update_cache: yes

    - name: Instalar Grafana
      apt:
        name: grafana
        state: present
        update_cache: yes

    - name: Iniciar y habilitar servicio de Grafana
      systemd:
        name: grafana-server
        state: started
        enabled: yes

    # ============================================
    # 3. CONFIGURACIÓN DEL FIREWALL
    # ============================================
    - name: Permitir puertos de Prometheus
      ufw:
        rule: allow
        port: "9090"
        proto: tcp

    - name: Permitir puertos de Grafana
      ufw:
        rule: allow
        port: "3000"
        proto: tcp

    # ============================================
    # 4. VERIFICACIÓN DEL ESTADO DE LOS SERVICIOS
    # ============================================
    - name: Esperar a que Prometheus esté disponible
      uri:
        url: "http://localhost:9090/-/healthy"
        method: GET
        status_code: 200
      register: result
      until: result.status == 200
      retries: 30
      delay: 10

    - name: Mostrar estado de Prometheus
      debug:
        msg: "Prometheus está disponible en http://{{ ansible_default_ipv4.address }}:9090"

    - name: Esperar a que Grafana esté disponible
      uri:
        url: "http://localhost:3000/api/health"
        method: GET
        status_code: 200
      register: result
      until: result.status == 200
      retries: 30
      delay: 10

    - name: Mostrar estado de Grafana
      debug:
        msg: "Grafana está disponible en http://{{ ansible_default_ipv4.address }}:3000"

    # ============================================
    # 5. LIMPIEZA
    # ============================================
    - name: Eliminar archivos temporales de Prometheus
      file:
        path: "/tmp/prometheus-2.47.1.linux-amd64"
        state: absent

    - name: Eliminar archivo comprimido de Prometheus
      file:
        path: "/tmp/prometheus-2.47.1.linux-amd64.tar.gz"
        state: absent

    - name: Reiniciar servicios para aplicar cambios
      systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - prometheus
        - grafana-server

    # ============================================
    # 6. CONFIGURACIÓN ADICIONAL DE GRAFANA
    # ============================================
    - name: Configurar datasource de Prometheus en Grafana
      grafana_datasource:
        name: Prometheus
        type: prometheus
        url: http://localhost:9090
        access: proxy
        basic_auth_user: ''
        basic_auth_password: ''
        is_default: true
        state: present

    - name: Configurar dashboard básico en Grafana
      grafana_dashboard:
        state: present
        dashboard:
          id: 1
          title: "Prometheus Overview"
          panels:
            - id: 1
              title: "CPU Usage"
              type: "graph"
              datasource: "Prometheus"
              targets:
                - expr: "100 - (avg by (instance)(irate(node_cpu_seconds_total{mode='idle'}[5m])) * 100)"
                  legend: "{{ instance }}"
              xaxis:
                mode: "time"
              yaxes:
                - format: "percent"
                  min: 0
                  max: 100
            - id: 2
              title: "Memory Usage"
              type: "graph"
              datasource: "Prometheus"
              targets:
                - expr: "1 - (node_memory_available_bytes / node_memory_total_bytes)"
                  legend: "{{ instance }}"
              xaxis:
                mode: "time"
              yaxes:
                - format: "percent"
                  min: 0
                  max: 100
            - id: 3
              title: "Disk Usage"
              type: "graph"
              datasource: "Prometheus"
              targets:
                - expr: "1 - (node_filesystem_avail_bytes{fstype!~'tmpfs|devtmpfs'} / node_filesystem_size_bytes{fstype!~'tmpfs|devtmpfs'})"
                  legend: "{{ instance }}"
              xaxis:
                mode: "time"
              yaxes:
                - format: "percent"
                  min: 0
                  max: 100
        overwrite: true

    - name: Crear usuario admin en Grafana
      grafana_user:
        login: admin
        password: admin
        email: admin@example.com
        role: Admin
        state: present

    - name: Reiniciar servicio de Grafana
      systemd:
        name: grafana-server
        state: restarted

    # ============================================
    # 7. CONFIGURACIÓN DE ALERTAS EN GRAFANA
    # ============================================
    - name: Configurar canal de alerta por correo electrónico
      grafana_alert_channel:
        name: "Email"
        type: "email"
        settings:
          addresses: "admin@example.com"
          from: "alertas@example.com"
          smtp_host: "smtp.example.com"
          smtp_port: 587
          smtp_user: "smtp_user"
          smtp_password: "smtp_password"
          secure: true
        state: present

    - name: Crear regla de alerta para uso de CPU
      grafana_alert:
        name: "Alerta de CPU alta"
        type: "threshold"
        datasource: "Prometheus"
        query: "100 - (avg by (instance)(irate(node_cpu_seconds_total{mode='idle'}[5m])) * 100) > 80"
        interval: "1m"
        for: "5m"
        severity: "critical"
        notifications:
          - "Email"
        state: present

    - name: Crear regla de alerta para uso de memoria
      grafana_alert:
        name: "Alerta de memoria alta"
        type: "threshold"
        datasource: "Prometheus"
        query: "1 - (node_memory_available_bytes / node_memory_total_bytes) > 0.8"
        interval: "1m"
        for: "5m"
        severity: "critical"
        notifications:
          - "Email"
        state: present

    - name: Crear regla de alerta para uso de disco
      grafana_alert:
        name: "Alerta de disco lleno"
        type: "threshold"
        datasource: "Prometheus"
        query: "1 - (node_filesystem_avail_bytes{fstype!~'tmpfs|devtmpfs'} / node_filesystem_size_bytes{fstype!~'tmpfs|devtmpfs'}) > 0.8"
        interval: "1m"
        for: "5m"
        severity: "critical"
        notifications:
          - "Email"
        state: present

    # ============================================
    # 8. VERIFICACIÓN FINAL
    # ============================================
    - name: Verificar estado de Prometheus
      command: curl -s http://localhost:9090/-/healthy
      register: prometheus_health
      changed_when: false

    - name: Mostrar estado de Prometheus
      debug:
        msg: "Estado de Prometheus: {{ prometheus_health.stdout }}"

    - name: Verificar estado de Grafana
      command: curl -s http://localhost:3000/api/health
      register: grafana_health
      changed_when: false

    - name: Mostrar estado de Grafana
      debug:
        msg: "Estado de Grafana: {{ grafana_health.stdout }}"

    - name: Mostrar URL de acceso a Grafana
      debug:
        msg: "Accede a Grafana en: http://{{ ansible_default_ipv4.address }}:3000"

    - name: Mostrar credenciales de Grafana
      debug:
        msg: "Credenciales de Grafana - Usuario: admin, Contraseña: admin"

    # ============================================
    # LIMPIEZA FINAL
    # ============================================
    - name: Eliminar archivos temporales de configuración de Prometheus
      file:
        path: "/etc/prometheus/prometheus.yml"
        state: absent

    - name: Eliminar usuario y grupo de sistema para Prometheus
      user:
        name: prometheus
        state: absent

      group:
        name: prometheus
        state: absent

    - name: Eliminar binario de Prometheus
      file:
        path: "/usr/local/bin/prometheus"
        state: absent

    - name: Detener y deshabilitar servicio de Prometheus
      systemd:
        name: prometheus
        state: stopped
        enabled: no

    - name: Detener y deshabilitar servicio de Grafana
      systemd:
        name: grafana-server
        state: stopped
        enabled: no

    - name: Reiniciar servicios para aplicar cambios
      systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - sonarqube
        - prometheus
        - grafana-server

    # ============================================
    # 9. CONFIGURACIÓN DE SEGURIDAD
    # ============================================
    - name: Configurar cortafuegos (firewall) para permitir tráfico necesario
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"    # SSH
        - "9000"  # SonarQube
        - "9090"  # Prometheus
        - "3000"  # Grafana

    - name: Configurar fail2ban para proteger el servidor SSH
      copy:
        src: fail2ban/jail.local
        dest: /etc/fail2ban/jail.local
        mode: '0644'

    - name: Iniciar y habilitar fail2ban
      systemd:
        name: fail2ban
        state: started
        enabled: yes

    # ============================================
    # 10. MONITOREO Y MANTENIMIENTO
    # ============================================
    - name: Configurar tareas de monitoreo y mantenimiento
      cron:
        name: "Monitoreo y mantenimiento de SonarQube, Prometheus y Grafana"
        minute: "0"
        hour: "*/6"
        job: "/usr/bin/systemctl restart sonarqube prometheus grafana-server"
        state: present

    - name: Configurar alerta por correo electrónico para fallos en servicios críticos
      mail:
        host: "smtp.example.com"
        port: 587
        username: "smtp_user"
        password: "smtp_password"
        to: "admin@example.com"
        subject: "Alerta: Servicio crítico caído en {{ ansible_hostname }}"
        body: "El servicio {{ item }} ha caído en el servidor {{ ansible_hostname }}. Se intentará reiniciar automáticamente."
        state: present
      loop:
        - sonarqube
        - prometheus
        - grafana-server

    - name: Configurar copia de seguridad automática de la base de datos de SonarQube
      cron:
        name: "Copia de seguridad de la base de datos de SonarQube"
        minute: "0"
        hour: "2"
        job: "/usr/bin/pg_dump -U {{ sonar_db_user }} -h localhost -F c -b -v -f /var/backups/sonarqube_db_backup.dump {{ sonar_db_name }}"
        state: present

    - name: Configurar limpieza de archivos de copia de seguridad antiguos
      cron:
        name: "Limpieza de archivos de copia de seguridad antiguos"
        minute: "0"
        hour: "3"
        job: "/usr/bin/find /var/backups -name 'sonarqube_db_backup.dump*' -type f -mtime +30 -exec /bin/rm {} \;"
        state: present

    # ============================================
    # 11. DOCUMENTACIÓN Y REGISTROS
    # ============================================
    - name: Crear directorio para documentación y registros
      file:
        path: /var/log/sonarqube
        state: directory
        owner: "{{ sonar_user }}"
        group: "{{ sonar_group }}"
        mode: '0755'

    - name: Configurar registro detallado de SonarQube
      lineinfile:
        path: "{{ sonar_install_dir }}/conf/sonar.properties"
        regexp: "^#?sonar.log.level="
        line: "sonar.log.level=DEBUG"
        state: present

    - name: Reiniciar SonarQube para aplicar configuración de registro
      systemd:
        name: sonarqube
        state: restarted

    - name: Crear documentación inicial en Confluence
      confluence_page:
        space: "DEVOPS"
        title: "Documentación de implementación de SonarQube, Prometheus y Grafana"
        content: |
          # Documentación de implementación de SonarQube, Prometheus y Grafana
          Esta documentación describe el proceso de implementación de SonarQube, Prometheus y Grafana en una VM de Azure.
          ## 1. Introducción
          - **SonarQube**: Plataforma para revisión de código y análisis de calidad.
          - **Prometheus**: Sistema de monitoreo y alerta.
          - **Grafana**: Herramienta de visualización y análisis de métricas.
        state: present

    - name: Configurar exportación de métricas de SonarQube a Prometheus
      lineinfile:
        path: "{{ sonar_install_dir }}/conf/sonar.properties"
        regexp: "^#?sonar.prometheus.enabled="
        line: "sonar.prometheus.enabled=true"
        state: present

    - name: Reiniciar SonarQube para aplicar configuración de exportación de métricas
      systemd:
        name: sonarqube
        state: restarted

    - name: Crear dashboard inicial en Grafana
      grafana_dashboard:
        state: present
        dashboard:
          id: 1
          title: "SonarQube Overview"
          panels:
            - id: 1
              title: "SonarQube Status"
              type: "singlestat"
              datasource: "Prometheus"
              targets:
                - expr: "sonar_server_up"
                  legend: "{{ instance }}"
              valueMappings:
                - value: "1"
                  text: "Up"
                - value: "0"
                  text: "Down"
            - id: 2
              title: "Quality Gate Status"
              type: "piechart"
              datasource: "Prometheus"
              targets:
                - expr: "sonar_qualitygate_status"
                  legend: "{{ instance }}"
              pieChart:
                values:
                  - "OK"
                  - "WARN"
                  - "ERROR"
            - id: 3
              title: "Code Coverage"
              type: "graph"
              datasource: "Prometheus"
              targets:
                - expr: "sonar_project_coverage"
                  legend: "{{ instance }}"
              xaxis:
                mode: "time"
              yaxes:
                - format: "percent"
                  min: 0
                  max: 100
        overwrite: true

    - name: Configurar alertas de SonarQube en Grafana
      grafana_alert:
        name: "Alerta de SonarQube - Servicio caído"
        type: "threshold"
        datasource: "Prometheus"
        query: "sonar_server_up == 0"
        interval: "1m"
        for: "5m"
        severity: "critical"
        notifications:
          - "Email"
        state: present

    - name: Configurar notificaciones de alerta en Grafana
      grafana_notification_channel:
        name: "Email"
        type: "email"
        settings:
          addresses: "admin@example.com"
          from: "alertas@example.com"
          smtp_host: "smtp.example.com"
          smtp_port: 587
          smtp_user: "smtp_user"
          smtp_password: "smtp_password"
          secure: true
        state: present

    - name: Reiniciar servicios para aplicar cambios finales
      systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - sonarqube
        - prometheus
        - grafana-server

    - name: Mostrar mensaje de finalización
      debug:
        msg: "La implementación y configuración de SonarQube, Prometheus y Grafana se ha completado exitosamente."