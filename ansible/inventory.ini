---
# Ansible Playbook COMPLETO: Provisión VM en Azure + Configuración SonarQube
# Requisitos: 
#   - Azure CLI instalado y autenticado (az login)
#   - Colección azure.azcollection: ansible-galaxy collection install azure.azcollection
#   - Python packages: pip install ansible[azure]
# Uso: ansible-playbook provision-vm-and-sonarqube.yml --ask-vault-pass

- name: Provisionar VM en Azure para SonarQube
  hosts: localhost
  connection: local
  vars:
    # Azure configuración
    resource_group: "rg-sonarqube-prod"
    location: "eastus"  # Cambiar según tu región
    vm_name: "vm-sonarqube"
    vm_size: "Standard_D4s_v3"  # 4 vCPU, 16GB RAM - recomendado para SonarQube
    admin_username: "azureuser"
    ssh_public_key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"
    
    # Red
    vnet_name: "vnet-sonarqube"
    subnet_name: "subnet-sonarqube"
    nsg_name: "nsg-sonarqube"
    public_ip_name: "pip-sonarqube"
    nic_name: "nic-sonarqube"
    
    # Tags
    tags:
      Environment: "Production"
      Project: "React-Chat-CI"
      ManagedBy: "Ansible"

  tasks:
    # ============================================
    # 1. CREAR GRUPO DE RECURSOS
    # ============================================
    - name: Crear Resource Group
      azure.azcollection.azure_rm_resourcegroup:
        name: "{{ resource_group }}"
        location: "{{ location }}"
        tags: "{{ tags }}"
      register: rg

    # ============================================
    # 2. CREAR RED VIRTUAL
    # ============================================
    - name: Crear Virtual Network
      azure.azcollection.azure_rm_virtualnetwork:
        resource_group: "{{ resource_group }}"
        name: "{{ vnet_name }}"
        address_prefixes: "10.0.0.0/16"
        tags: "{{ tags }}"

    - name: Crear Subnet
      azure.azcollection.azure_rm_subnet:
        resource_group: "{{ resource_group }}"
        virtual_network: "{{ vnet_name }}"
        name: "{{ subnet_name }}"
        address_prefix: "10.0.1.0/24"

    # ============================================
    # 3. CREAR IP PÚBLICA
    # ============================================
    - name: Crear Public IP
      azure.azcollection.azure_rm_publicipaddress:
        resource_group: "{{ resource_group }}"
        name: "{{ public_ip_name }}"
        allocation_method: Static
        sku: Standard
        tags: "{{ tags }}"
      register: public_ip

    - name: Mostrar IP pública asignada
      debug:
        msg: "IP Pública: {{ public_ip.state.ip_address }}"

    # ============================================
    # 4. CREAR NETWORK SECURITY GROUP
    # ============================================
    - name: Crear Network Security Group
      azure.azcollection.azure_rm_securitygroup:
        resource_group: "{{ resource_group }}"
        name: "{{ nsg_name }}"
        tags: "{{ tags }}"
        rules:
          - name: 'AllowSSH'
            protocol: Tcp
            destination_port_range: 22
            access: Allow
            priority: 100
            direction: Inbound
            source_address_prefix: '*'  # CAMBIAR A TU IP EN PRODUCCIÓN
          - name: 'AllowSonarQube'
            protocol: Tcp
            destination_port_range: 9000
            access: Allow
            priority: 110
            direction: Inbound
            source_address_prefix: '*'  # CAMBIAR A GITHUB RUNNER IPS O VNet

    # ============================================
    # 5. CREAR NETWORK INTERFACE
    # ============================================
    - name: Crear Network Interface
      azure.azcollection.azure_rm_networkinterface:
        resource_group: "{{ resource_group }}"
        name: "{{ nic_name }}"
        virtual_network: "{{ vnet_name }}"
        subnet: "{{ subnet_name }}"
        security_group: "{{ nsg_name }}"
        ip_configurations:
          - name: ipconfig1
            public_ip_address_name: "{{ public_ip_name }}"
            primary: true
        tags: "{{ tags }}"

    # ============================================
    # 6. CREAR MÁQUINA VIRTUAL
    # ============================================
    - name: Crear VM Ubuntu para SonarQube
      azure.azcollection.azure_rm_virtualmachine:
        resource_group: "{{ resource_group }}"
        name: "{{ vm_name }}"
        vm_size: "{{ vm_size }}"
        admin_username: "{{ admin_username }}"
        ssh_password_enabled: false
        ssh_public_keys:
          - path: "/home/{{ admin_username }}/.ssh/authorized_keys"
            key_data: "{{ ssh_public_key }}"
        network_interfaces: "{{ nic_name }}"
        image:
          offer: 0001-com-ubuntu-server-jammy
          publisher: Canonical
          sku: 22_04-lts-gen2
          version: latest
        os_disk_size_gb: 128  # 128GB para datos, logs, y crecimiento
        managed_disk_type: Premium_LRS  # SSD para mejor performance
        tags: "{{ tags }}"
      register: vm

    - name: Agregar VM al inventario dinámico
      add_host:
        name: "{{ public_ip.state.ip_address }}"
        groups: sonarqube_server
        ansible_user: "{{ admin_username }}"
        ansible_ssh_private_key_file: "~/.ssh/id_rsa"

    # ============================================
    # 7. ESPERAR A QUE LA VM ESTÉ LISTA
    # ============================================
    - name: Esperar a que SSH esté disponible
      wait_for:
        host: "{{ public_ip.state.ip_address }}"
        port: 22
        delay: 10
        timeout: 300
        state: started

    - name: Guardar información de la VM
      copy:
        content: |
          VM creada exitosamente:
          - Nombre: {{ vm_name }}
          - Resource Group: {{ resource_group }}
          - IP Pública: {{ public_ip.state.ip_address }}
          - Usuario: {{ admin_username }}
          - Región: {{ location }}
          - Tamaño: {{ vm_size }}
          
          Conectar via SSH:
          ssh {{ admin_username }}@{{ public_ip.state.ip_address }}
          
          URL SonarQube (una vez configurado):
          http://{{ public_ip.state.ip_address }}:9000
        dest: "./vm-info.txt"
      delegate_to: localhost

# ============================================
# SEGUNDA PARTE: CONFIGURAR SONARQUBE EN LA VM
# ============================================
- name: Configurar SonarQube en la VM recién creada
  hosts: sonarqube_server
  become: yes
  vars:
    sonarqube_version: "10.7.0.96327"
    sonarqube_download_url: "https://binaries.sonarsource.com/Distribution/sonarqube/sonarqube-{{ sonarqube_version }}.zip"
    postgres_version: "15"
    sonar_db_name: "sonar"
    sonar_db_user: "sonar"
    sonar_db_password: "{{ vault_sonar_db_password | default('S0n4rP@ssw0rd!2025') }}"
    sonar_install_dir: "/opt/sonarqube"
    sonar_data_dir: "/var/sonarqube"
    sonar_user: "sonarqube"
    sonar_group: "sonarqube"
    java_version: "17"

  tasks:
    # Importar las mismas tareas del playbook anterior (configure-sonarqube.yml)
    # Para evitar duplicación, se puede usar import_tasks o include_tasks
    
    - name: Actualizar cache de paquetes
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Instalar dependencias del sistema
      apt:
        name:
          - openjdk-{{ java_version }}-jdk
          - unzip
          - wget
          - curl
          - gnupg2
          - software-properties-common
        state: present

    - name: Agregar repositorio PostgreSQL
      shell: |
        echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list
        wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | apt-key add -
      args:
        creates: /etc/apt/sources.list.d/pgdg.list

    - name: Instalar PostgreSQL
      apt:
        name:
          - postgresql-{{ postgres_version }}
          - postgresql-contrib-{{ postgres_version }}
          - python3-psycopg2
        state: present
        update_cache: yes

    - name: Iniciar PostgreSQL
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: Crear usuario y base de datos PostgreSQL
      become_user: postgres
      block:
        - name: Crear usuario PostgreSQL
          postgresql_user:
            name: "{{ sonar_db_user }}"
            password: "{{ sonar_db_password }}"
            role_attr_flags: CREATEDB,NOSUPERUSER

        - name: Crear base de datos
          postgresql_db:
            name: "{{ sonar_db_name }}"
            owner: "{{ sonar_db_user }}"
            encoding: UTF8
            template: template0

    # [Continuar con el resto de tareas del playbook anterior...]
    # Por brevedad, reutilizar la lógica completa de configure-sonarqube.yml

  handlers:
    - name: restart sonarqube
      systemd:
        name: sonarqube
        state: restarted